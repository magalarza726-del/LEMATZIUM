name: Build LEMATZIUM Windows installer
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'LEMATZIUM-1.3.3.zip'
      - 'LEMATZIUM 1.3.3.zip'
      - '.github/workflows/windows-installer.yml'
      - 'installer/**'
permissions:
  contents: write
concurrency:
  group: lematzium-windows-v1.3.3
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          architecture: 'x64'
      - name: Sanitize source archive
        shell: pwsh
        run: |
          @'
          import json, pathlib, zipfile, re
          original = pathlib.Path("LEMATZIUM 1.3.3.zip")
          clean = pathlib.Path("LEMATZIUM-1.3.3.zip")
          source = original if original.exists() else clean
          if not source.exists():
              raise SystemExit("Source archive missing")
          temp = clean.with_suffix(".tmp")
          with zipfile.ZipFile(source) as z, zipfile.ZipFile(temp, "w", zipfile.ZIP_DEFLATED, compresslevel=9) as out:
              for entry in z.infolist():
                  path = pathlib.PurePosixPath(entry.filename)
                  if entry.is_dir() or "__pycache__" in path.parts or path.suffix.lower() in {".pyc", ".pdf"}:
                      continue
                  if path.is_absolute() or ".." in path.parts:
                      raise SystemExit("Unsafe archive path")
                  data = z.read(entry)
                  if path.name == "lematzium_suite_launcher_prefs.json":
                      obj = json.loads(data)
                      obj["gemini_api_key"] = ""
                      data = json.dumps(obj, ensure_ascii=False, indent=2).encode("utf-8")
                  if path.name == "assistant_conversations.json":
                      obj = json.loads(data)
                      obj["conversations"] = []
                      obj["saved_at"] = ""
                      data = json.dumps(obj, ensure_ascii=False, indent=2).encode("utf-8")
                  if re.search(rb"AIza[0-9A-Za-z_-]{35}", data):
                      raise SystemExit("Potential embedded credential; build stopped")
                  out.writestr(entry.filename, data)
          temp.replace(clean)
          print("Sanitized archive ready")
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'Source sanitization failed' }
      - name: Replace original archive on main
        shell: pwsh
        run: |
          if (Test-Path 'LEMATZIUM 1.3.3.zip') {
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git rm -- 'LEMATZIUM 1.3.3.zip'
            if ($LASTEXITCODE -ne 0) { throw 'Could not remove original archive' }
            git add -- 'LEMATZIUM-1.3.3.zip'
            git commit -m 'Replace source archive with sanitized distribution'
            if ($LASTEXITCODE -ne 0) { throw 'Could not commit clean archive' }
            git push origin HEAD:main
            if ($LASTEXITCODE -ne 0) { throw 'Could not push clean archive' }
          }
      - name: Build and validate
        shell: powershell
        run: .\installer\build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: LEMATZIUM-Setup-1.3.3
          path: |
            release/LEMATZIUM_Setup_1.3.3.exe
            release/LEMATZIUM_Setup_1.3.3.exe.sha256
          if-no-files-found: error
      - name: Publish installer
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v1.3.3 --repo $env:GITHUB_REPOSITORY
          if ($LASTEXITCODE -ne 0) {
            gh release create v1.3.3 --repo $env:GITHUB_REPOSITORY --target main --title "LEMATZIUM 1.3.3" --notes "Instalador Windows x64 con Python y dependencias integrados. Validaciones automatizadas ejecutadas; pruebas manuales de todas las funciones pendientes."
            if ($LASTEXITCODE -ne 0) { throw 'Could not create release' }
          }
          gh release upload v1.3.3 release/LEMATZIUM_Setup_1.3.3.exe release/LEMATZIUM_Setup_1.3.3.exe.sha256 --repo $env:GITHUB_REPOSITORY --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Could not upload release assets' }
