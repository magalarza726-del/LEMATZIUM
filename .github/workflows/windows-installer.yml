name: Build LEMATZIUM Windows installer
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'LEMATZIUM-1.3.3.zip'
      - '.github/workflows/windows-installer.yml'
      - 'installer/**'
permissions:
  contents: write
concurrency:
  group: lematzium-windows-v1.3.3
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Check source package
        shell: pwsh
        run: |
          if (!(Test-Path 'LEMATZIUM-1.3.3.zip')) { throw 'Upload the sanitized LEMATZIUM-1.3.3.zip to the repository root first.' }
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          architecture: 'x64'
      - name: Build and validate
        shell: powershell
        run: .\installer\build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: LEMATZIUM-Setup-1.3.3
          path: |
            release/LEMATZIUM_Setup_1.3.3.exe
            release/LEMATZIUM_Setup_1.3.3.exe.sha256
          if-no-files-found: error
      - name: Publish installer
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v1.3.3 --repo $env:GITHUB_REPOSITORY
          if ($LASTEXITCODE -ne 0) {
            gh release create v1.3.3 --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "LEMATZIUM 1.3.3" --notes "Instalador Windows x64 con Python y dependencias integrados. Validaciones automatizadas ejecutadas; pruebas manuales de todas las funciones pendientes."
            if ($LASTEXITCODE -ne 0) { throw 'Could not create release' }
          }
          gh release upload v1.3.3 release/LEMATZIUM_Setup_1.3.3.exe release/LEMATZIUM_Setup_1.3.3.exe.sha256 --repo $env:GITHUB_REPOSITORY --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Could not upload release assets' }
